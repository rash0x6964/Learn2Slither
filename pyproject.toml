[project]
name = "learn2slither"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 79

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
 
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
